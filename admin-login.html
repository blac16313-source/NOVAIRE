<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Admin Login — NOVAIR</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Playfair+Display:ital@0;1&display=swap" rel="stylesheet">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  min-height:100vh;
  background:#171714;
  color:#f3f0e9;
  font-family:"DM Sans",sans-serif;
  display:grid;
  place-items:center;
  padding:20px;
}

.login{
  width:min(440px,100%);
}

.logo{
  text-align:center;
  font-size:27px;
  font-weight:600;
  letter-spacing:.24em;
  margin-bottom:55px;
}

.logo span{
  display:block;
  margin-top:12px;
  font-size:9px;
  font-weight:400;
  letter-spacing:.2em;
  color:#77746d;
  text-transform:uppercase;
}

.card{
  background:#f3f0e9;
  color:#171714;
  padding:42px;
}

.eyebrow{
  font-size:9px;
  text-transform:uppercase;
  letter-spacing:.2em;
  color:#77736a;
  margin-bottom:20px;
}

h1{
  font-family:"Playfair Display",serif;
  font-size:43px;
  line-height:.95;
  font-weight:400;
  letter-spacing:-.04em;
}

h1 em{
  font-style:italic;
}

.subtitle{
  margin-top:20px;
  color:#68655e;
  font-size:13px;
  line-height:1.7;
}

form{
  margin-top:40px;
}

.field{
  margin-bottom:22px;
}

label{
  display:block;
  font-size:9px;
  text-transform:uppercase;
  letter-spacing:.16em;
  color:#77736a;
  margin-bottom:9px;
}

input{
  width:100%;
  height:48px;
  border:1px solid rgba(23,23,20,.18);
  background:#fffdf8;
  padding:0 13px;
  outline:none;
  color:#171714;
  font-size:14px;
}

input:focus{
  border-color:#171714;
}

button{
  width:100%;
  height:52px;
  border:0;
  background:#171714;
  color:#f3f0e9;
  text-transform:uppercase;
  letter-spacing:.15em;
  font-size:10px;
  cursor:pointer;
  transition:.25s;
}

button:hover{
  background:#35332e;
}

button:disabled{
  opacity:.5;
  cursor:not-allowed;
}

.message{
  display:none;
  margin-top:18px;
  padding:12px;
  font-size:11px;
  line-height:1.6;
}

.message.error{
  display:block;
  background:#eee0dc;
  color:#7d342d;
}

.message.success{
  display:block;
  background:#e1e9df;
  color:#3d5d43;
}

.back{
  display:block;
  text-align:center;
  margin-top:25px;
  color:#77746d;
  font-size:10px;
  text-transform:uppercase;
  letter-spacing:.14em;
}

.back:hover{
  color:#f3f0e9;
}

@media(max-width:500px){

  .card{
    padding:30px 24px;
  }

  h1{
    font-size:38px;
  }

}
</style>
</head>

<body>

<div class="login">

  <div class="logo">
    NOVAIR
    <span>Store management</span>
  </div>

  <div class="card">

    <div class="eyebrow">
      Private workspace
    </div>

    <h1>
      Welcome<br>
      <em>back.</em>
    </h1>

    <p class="subtitle">
      Sign in to manage the NOVAIR collection.
    </p>

    <form id="loginForm">

      <div class="field">

        <label for="email">
          Email
        </label>

        <input
          id="email"
          type="email"
          placeholder="you@example.com"
          autocomplete="email"
          required
        >

      </div>


      <div class="field">

        <label for="password">
          Password
        </label>

        <input
          id="password"
          type="password"
          placeholder="Your password"
          autocomplete="current-password"
          required
        >

      </div>


      <button id="loginButton" type="submit">
        Sign In
      </button>

      <div id="message" class="message"></div>

    </form>

  </div>

  <a href="index.html" class="back">
    ← Back to NOVAIR
  </a>

</div>


<script>

/*
  NOVAIR
  Shared Agency Backend
*/

const SUPABASE_URL =
  "https://sjtykmeactnxwwywdjcr.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
  "sb_publishable_fB56OtJ845eqt7lIAwU-VA_VgM2ZqJW";

const STORE_ID = "novair";


const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_PUBLISHABLE_KEY
  );


const form =
  document.getElementById("loginForm");

const button =
  document.getElementById("loginButton");

const message =
  document.getElementById("message");


function showMessage(text,type){

  message.textContent = text;

  message.className =
    "message " + type;

}


async function checkExistingLogin(){

  const {
    data:{
      user
    }
  } = await supabaseClient.auth.getUser();


  if(!user){
    return;
  }


  const {
    data:membership,
    error
  } = await supabaseClient
    .from("store_members")
    .select("store_id, role")
    .eq("store_id",STORE_ID)
    .eq("user_id",user.id)
    .maybeSingle();


  if(error){
    console.error(error);
    return;
  }


  if(membership){

    window.location.href =
      "products-management.html";

  }

}


checkExistingLogin();


form.addEventListener(
  "submit",
  async function(e){

    e.preventDefault();

    button.disabled = true;
    button.textContent = "Signing in...";

    message.className = "message";


    const email =
      document
        .getElementById("email")
        .value
        .trim();

    const password =
      document
        .getElementById("password")
        .value;


    const {
      data,
      error
    } =
      await supabaseClient.auth.signInWithPassword({
        email,
        password
      });


    if(error){

      console.error(error);

      showMessage(
        "Sign in failed. Check your email and password.",
        "error"
      );

      button.disabled = false;
      button.textContent = "Sign In";

      return;

    }


    const user =
      data.user;


    const {
      data:membership,
      error:membershipError
    } =
      await supabaseClient
        .from("store_members")
        .select("store_id, role")
        .eq("store_id",STORE_ID)
        .eq("user_id",user.id)
        .maybeSingle();


    if(membershipError){

      await supabaseClient.auth.signOut();

      showMessage(
        "We couldn't verify your store access.",
        "error"
      );

      button.disabled = false;
      button.textContent = "Sign In";

      return;

    }


    if(!membership){

      await supabaseClient.auth.signOut();

      showMessage(
        "Your account does not have access to NOVAIR.",
        "error"
      );

      button.disabled = false;
      button.textContent = "Sign In";

      return;

    }


    showMessage(
      "Login successful. Opening your workspace...",
      "success"
    );


    setTimeout(function(){

      window.location.href =
        "products-management.html";

    },500);

  }
);

</script>

</body>
</html>
