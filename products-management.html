<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>Product Management — NOVAIR</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,Helvetica,sans-serif;
  background:#f3f0ea;
  color:#111;
}


/* =========================
   LOGIN
========================= */

#loginScreen{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:24px;
}

.login-card{
  width:100%;
  max-width:430px;
  background:#fff;
  border-radius:24px;
  padding:40px;
  box-shadow:0 20px 60px rgba(0,0,0,.08);
}

.login-logo{
  font-size:28px;
  letter-spacing:5px;
  font-weight:700;
  margin-bottom:8px;
}

.login-subtitle{
  color:#777;
  font-size:14px;
  margin-bottom:32px;
}

.login-card label{
  display:block;
  font-size:12px;
  font-weight:600;
  margin-bottom:8px;
  text-transform:uppercase;
  letter-spacing:1px;
}

.login-card input{
  width:100%;
  padding:15px;
  border:1px solid #ddd;
  border-radius:10px;
  margin-bottom:18px;
  font-size:14px;
  outline:none;
}

.login-card input:focus{
  border-color:#111;
}

.login-btn{
  width:100%;
  border:0;
  background:#111;
  color:#fff;
  padding:16px;
  border-radius:10px;
  font-size:14px;
  cursor:pointer;
}

.login-btn:hover{
  background:#292929;
}

.login-btn:disabled{
  opacity:.6;
  cursor:not-allowed;
}

.login-error{
  display:none;
  margin-bottom:18px;
  padding:12px;
  border-radius:8px;
  background:#fff0f0;
  color:#b00020;
  font-size:13px;
}


/* =========================
   APP
========================= */

#app{
  display:none;
  min-height:100vh;
}

.sidebar{
  position:fixed;
  left:0;
  top:0;
  bottom:0;
  width:240px;
  background:#111;
  color:#fff;
  padding:28px 20px;
}

.brand{
  font-size:25px;
  letter-spacing:5px;
  font-weight:700;
  padding:0 12px;
  margin-bottom:50px;
}

.nav-title{
  font-size:10px;
  color:#777;
  letter-spacing:2px;
  text-transform:uppercase;
  padding:0 12px;
  margin-bottom:12px;
}

.nav-item{
  display:block;
  width:100%;
  padding:13px 12px;
  border-radius:9px;
  color:#aaa;
  text-decoration:none;
  font-size:13px;
  margin-bottom:5px;
}

.nav-item.active,
.nav-item:hover{
  background:#242424;
  color:#fff;
}

.logout{
  position:absolute;
  left:20px;
  right:20px;
  bottom:25px;
  border:1px solid #333;
  background:transparent;
  color:#aaa;
  padding:12px;
  border-radius:9px;
  cursor:pointer;
}

.logout:hover{
  color:#fff;
  border-color:#555;
}


/* =========================
   MAIN
========================= */

.main{
  margin-left:240px;
  padding:40px;
}

.topbar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:35px;
}

.page-title{
  font-family:Georgia,serif;
  font-size:38px;
  font-weight:400;
}

.store-badge{
  background:#fff;
  border:1px solid #e5e1da;
  padding:10px 14px;
  border-radius:10px;
  font-size:12px;
}

.store-badge strong{
  letter-spacing:1px;
}


/* =========================
   STATS
========================= */

.stats{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:16px;
  margin-bottom:30px;
}

.stat{
  background:#fff;
  border-radius:16px;
  padding:24px;
  border:1px solid #e8e4dd;
}

.stat-label{
  font-size:11px;
  text-transform:uppercase;
  letter-spacing:1.5px;
  color:#888;
  margin-bottom:12px;
}

.stat-value{
  font-family:Georgia,serif;
  font-size:30px;
}


/* =========================
   PRODUCTS
========================= */

.products-box{
  background:#fff;
  border:1px solid #e8e4dd;
  border-radius:20px;
  overflow:hidden;
}

.products-header{
  padding:22px;
  display:flex;
  gap:12px;
  justify-content:space-between;
  align-items:center;
  border-bottom:1px solid #eee;
}

.search{
  width:280px;
  border:1px solid #ddd;
  border-radius:9px;
  padding:12px 14px;
  outline:none;
}

.search:focus{
  border-color:#111;
}

.add-btn{
  border:0;
  background:#111;
  color:#fff;
  padding:12px 18px;
  border-radius:9px;
  cursor:pointer;
}

.add-btn:hover{
  background:#292929;
}

.table-wrap{
  overflow-x:auto;
}

table{
  width:100%;
  border-collapse:collapse;
}

th{
  text-align:left;
  font-size:10px;
  text-transform:uppercase;
  letter-spacing:1.3px;
  color:#888;
  padding:17px 22px;
  border-bottom:1px solid #eee;
}

td{
  padding:18px 22px;
  border-bottom:1px solid #f0f0f0;
  font-size:13px;
}

.product-name{
  font-weight:600;
}

.category{
  color:#777;
}

.price{
  font-weight:600;
}

.actions{
  display:flex;
  gap:8px;
}

.action-btn{
  border:1px solid #ddd;
  background:#fff;
  padding:8px 11px;
  border-radius:7px;
  cursor:pointer;
  font-size:12px;
}

.action-btn:hover{
  border-color:#111;
}

.delete-btn:hover{
  border-color:#b00020;
  color:#b00020;
}

.empty{
  text-align:center;
  padding:60px 20px;
  color:#888;
}

.loading{
  text-align:center;
  padding:40px;
  color:#777;
}


/* =========================
   MODAL
========================= */

#productModal{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.45);
  align-items:center;
  justify-content:center;
  padding:20px;
  z-index:20;
}

.modal{
  width:100%;
  max-width:600px;
  background:#fff;
  border-radius:20px;
  padding:30px;
  max-height:90vh;
  overflow-y:auto;
}

.modal-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:25px;
}

.modal-title{
  font-family:Georgia,serif;
  font-size:28px;
  font-weight:400;
}

.close{
  border:0;
  background:#f2f2f2;
  width:35px;
  height:35px;
  border-radius:50%;
  cursor:pointer;
  font-size:18px;
}

.form-group{
  margin-bottom:17px;
}

.form-group label{
  display:block;
  font-size:11px;
  text-transform:uppercase;
  letter-spacing:1px;
  margin-bottom:7px;
  color:#555;
}

.form-group input,
.form-group textarea,
.form-group select{
  width:100%;
  border:1px solid #ddd;
  border-radius:9px;
  padding:13px;
  font-family:inherit;
  font-size:14px;
  outline:none;
}

.form-group input:focus,
.form-group textarea:focus,
.form-group select:focus{
  border-color:#111;
}

.form-group textarea{
  min-height:100px;
  resize:vertical;
}


/* IMAGE UPLOAD */

.image-upload{
  border:1px dashed #ccc;
  border-radius:12px;
  padding:20px;
  text-align:center;
  background:#fafafa;
}

.image-upload input{
  border:0;
  padding:0;
  background:transparent;
}

.image-status{
  margin-top:9px;
  font-size:12px;
  color:#777;
  line-height:1.5;
}


/* SIZES */

.form-row{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:14px;
}

.size-options{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
}

.size-option{
  border:1px solid #ddd;
  padding:9px 13px;
  border-radius:7px;
  cursor:pointer;
  font-size:12px;
}

.size-option.selected{
  background:#111;
  color:#fff;
  border-color:#111;
}


/* MODAL BUTTONS */

.modal-actions{
  display:flex;
  justify-content:flex-end;
  gap:10px;
  margin-top:25px;
}

.cancel-btn{
  border:1px solid #ddd;
  background:#fff;
  padding:13px 18px;
  border-radius:9px;
  cursor:pointer;
}

.save-btn{
  border:0;
  background:#111;
  color:#fff;
  padding:13px 22px;
  border-radius:9px;
  cursor:pointer;
}

.save-btn:disabled{
  opacity:.5;
  cursor:not-allowed;
}


/* =========================
   MOBILE
========================= */

@media(max-width:800px){

  .sidebar{
    position:relative;
    width:100%;
    height:auto;
    padding:18px;
  }

  .brand{
    margin-bottom:20px;
  }

  .nav-title{
    display:none;
  }

  .nav-item{
    display:inline-block;
    width:auto;
    margin-right:5px;
  }

  .logout{
    position:static;
    margin-top:12px;
    width:100%;
  }

  .main{
    margin-left:0;
    padding:22px;
  }

  .topbar{
    align-items:flex-start;
    gap:15px;
    flex-direction:column;
  }

  .page-title{
    font-size:32px;
  }

  .stats{
    grid-template-columns:1fr;
  }

  .products-header{
    flex-direction:column;
    align-items:stretch;
  }

  .search{
    width:100%;
  }

  .form-row{
    grid-template-columns:1fr;
  }

  .login-card{
    padding:28px 22px;
  }

}

</style>

</head>

<body>


<!-- =========================
     LOGIN SCREEN
========================= -->

<section id="loginScreen">

  <div class="login-card">

    <div class="login-logo">
      NOVAIR
    </div>

    <div class="login-subtitle">
      Product Management
    </div>

    <div
      id="loginError"
      class="login-error"
    ></div>

    <form id="loginForm">

      <label>
        Email
      </label>

      <input
        id="loginEmail"
        type="email"
        placeholder="Your admin email"
        required
      >

      <label>
        Password
      </label>

      <input
        id="loginPassword"
        type="password"
        placeholder="Your password"
        required
      >

      <button
        class="login-btn"
        type="submit"
        id="loginButton"
      >
        Sign In
      </button>

    </form>

  </div>

</section>


<!-- =========================
     APP
========================= -->

<section id="app">


  <aside class="sidebar">

    <div class="brand">
      NOVAIR
    </div>

    <div class="nav-title">
      Management
    </div>

    <a
      href="#"
      class="nav-item active"
    >
      Products
    </a>

    <a
      href="index.html"
      class="nav-item"
    >
      Website
    </a>

    <button
      class="logout"
      id="logoutButton"
    >
      Sign Out
    </button>

  </aside>


  <main class="main">


    <div class="topbar">

      <div class="page-title">
        Products
      </div>

      <div class="store-badge">

        Store:

        <strong>
          NOVAIR
        </strong>

      </div>

    </div>


    <!-- STATS -->

    <div class="stats">


      <div class="stat">

        <div class="stat-label">
          Total Products
        </div>

        <div
          class="stat-value"
          id="totalProducts"
        >
          0
        </div>

      </div>


      <div class="stat">

        <div class="stat-label">
          Categories
        </div>

        <div
          class="stat-value"
          id="totalCategories"
        >
          0
        </div>

      </div>


      <div class="stat">

        <div class="stat-label">
          Store Status
        </div>

        <div
          class="stat-value"
          style="font-size:20px"
        >
          Connected
        </div>

      </div>


    </div>


    <!-- PRODUCTS -->

    <section class="products-box">


      <div class="products-header">

        <input
          id="searchInput"
          class="search"
          type="text"
          placeholder="Search products..."
        >

        <button
          class="add-btn"
          id="addProductButton"
        >
          + Add Product
        </button>

      </div>


      <div class="table-wrap">

        <table>

          <thead>

            <tr>

              <th>
                Product
              </th>

              <th>
                Category
              </th>

              <th>
                Price
              </th>

              <th>
                Sizes
              </th>

              <th>
                Actions
              </th>

            </tr>

          </thead>


          <tbody id="productsTable">

          </tbody>

        </table>

      </div>


    </section>


  </main>

</section>


<!-- =========================
     PRODUCT MODAL
========================= -->

<div id="productModal">


  <div class="modal">


    <div class="modal-head">

      <div
        class="modal-title"
        id="modalTitle"
      >
        Add Product
      </div>

      <button
        class="close"
        id="closeModalButton"
        type="button"
      >
        ×
      </button>

    </div>


    <form id="productForm">


      <input
        type="hidden"
        id="productId"
      >

        </label>

            class="size-option"
            data-size="S"

            S
          </div>


          <div
            class="size-option"
            data-size="M"
          >
            M
          </div>


          <div
            class="size-option"
            data-size="L"
          >
            L
          </div>


          <div
            class="size-option"
            data-size="XL"
          >
            XL
          </div>


          <div
            class="size-option"
            data-size="XXL"
          >
            XXL
          </div>


        </div>

      </div>


      <div class="modal-actions">

        <button
          type="button"
          class="cancel-btn"
          id="cancelButton"

          Cancel

        <button

          class="save-btn"
          id="saveButton"
        >
          Save Product
        </button>

      </div>


    </form>


  </div>

</div>


<script>


/* ==========================================
   SUPABASE CONFIG
========================================== */

const SUPABASE_URL =
  "https://sjtykmeactnxwwywdjcr.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
  "sb_publishable_fB56OtJ845eqt7lIAwU-VA_VgM2ZqJW";

const STORE_ID =
  "novair";


const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_PUBLISHABLE_KEY
  );


/* ==========================================
   APP STATE
========================================== */

let products = [];

let editingProductId = null;

let selectedSizes = [];

let currentImageUrl = null;


/* ==========================================
   ELEMENTS
========================================== */

const loginScreen =
  document.getElementById("loginScreen");

const app =
  document.getElementById("app");

const loginForm =
  document.getElementById("loginForm");

const loginError =
  document.getElementById("loginError");

const loginButton =
  document.getElementById("loginButton");

const logoutButton =
  document.getElementById("logoutButton");

const productsTable =
  document.getElementById("productsTable");

const searchInput =
  document.getElementById("searchInput");

const productModal =
  document.getElementById("productModal");

const productForm =
  document.getElementById("productForm");

const addProductButton =
  document.getElementById("addProductButton");

const closeModalButton =
  document.getElementById("closeModalButton");

const cancelButton =
  document.getElementById("cancelButton");

const modalTitle =
  document.getElementById("modalTitle");

const totalProducts =
  document.getElementById("totalProducts");

const totalCategories =
  document.getElementById("totalCategories");

const imageStatus =
  document.getElementById("imageStatus");


/* ==========================================
   LOGIN ERROR
========================================== */

function showLoginError(message){

  loginError.textContent =
    message;

  loginError.style.display =
    "block";

}


/* ==========================================
   SHOW LOGIN
========================================== */

function showLogin(){

  loginScreen.style.display =
    "flex";

  app.style.display =
    "none";

}


/* ==========================================
   VERIFY STORE ACCESS
========================================== */

async function verifyStoreAccess(userId){

  const {
    data,
    error
  } = await supabaseClient
    .from("store_members")
    .select("store_id, role")
    .eq("store_id", STORE_ID)
    .eq("user_id", userId)
    .maybeSingle();


  if(error){

    console.error(error);

    await supabaseClient.auth.signOut();

    showLoginError(
      "Could not verify store access."
    );

    showLogin();

    return;

  }


  if(!data){

    await supabaseClient.auth.signOut();

    showLoginError(
      "This account does not have access to NOVAIR."
    );

    showLogin();

    return;

  }


  await showApp();

}


/* ==========================================
   CHECK SESSION
========================================== */

async function checkSession(){

  const {
    data,
    error
  } = await supabaseClient.auth.getSession();


  if(error){

    console.error(error);

    showLoginError(
      "Could not connect to Supabase."
    );

    showLogin();

    return;

  }


  if(data.session){

    await verifyStoreAccess(
      data.session.user.id
    );

  }else{

    showLogin();

  }

}


/* ==========================================
   SHOW APP
========================================== */

async function showApp(){

  loginScreen.style.display =
    "none";

  app.style.display =
    "block";

  await loadProducts();

}


/* ==========================================
   LOGIN
========================================== */

loginForm.addEventListener(
  "submit",
  async function(event){

    event.preventDefault();

    loginError.style.display =
      "none";


    const email =
      document.getElementById("loginEmail")
        .value
        .trim();


    const password =
      document.getElementById("loginPassword")
        .value;


    loginButton.disabled =
      true;

    loginButton.textContent =
      "Signing in...";


    const {
      data,
      error
    } = await supabaseClient.auth
      .signInWithPassword({
        email,
        password
      });


    if(error){

      console.error(error);

      showLoginError(
        error.message
      );

      loginButton.disabled =
        false;

      loginButton.textContent =
        "Sign In";

      return;

    }


    await verifyStoreAccess(
      data.user.id
    );


    loginButton.disabled =
      false;

    loginButton.textContent =
      "Sign In";

  }
);


/* ==========================================
   LOGOUT
========================================== */

logoutButton.addEventListener(
  "click",
  async function(){

    await supabaseClient.auth.signOut();

    products = [];

    showLogin();

  }
);


/* ==========================================
   LOAD PRODUCTS
========================================== */

async function loadProducts(){

  productsTable.innerHTML =
    `
      <tr>
        <td colspan="5">
          <div class="loading">
            Loading products...
          </div>
        </td>
      </tr>
    `;


  const {
    data,
    error
  } = await supabaseClient
    .from("products")
    .select("*")
    .eq("store_id", STORE_ID)
    .order("created_at", {
      ascending:false
    });


  if(error){

    console.error(error);

    productsTable.innerHTML =
      `
        <tr>
          <td colspan="5">
            <div class="empty">
              Could not load products.
            </div>
          </td>
        </tr>
      `;

    return;

  }


  products =
    data || [];

  renderProducts(products);

}


/* ==========================================
   RENDER PRODUCTS
========================================== */

function renderProducts(list){

  productsTable.innerHTML = "";


  if(list.length === 0){

    productsTable.innerHTML =
      `
        <tr>
          <td colspan="5">
            <div class="empty">
              No products yet.
              <br><br>
              Click "+ Add Product" to create your first one.
            </div>
          </td>
        </tr>
      `;

  }else{

    list.forEach(function(product){

      const row =
        document.createElement("tr");


      const sizes =
        Array.isArray(product.sizes)
          ? product.sizes.join(", ")
          : "-";


      row.innerHTML =
        `
          <td>
            <div class="product-name">
              ${escapeHtml(product.name)}
            </div>
          </td>

          <td>
            <div class="category">
              ${escapeHtml(product.category || "-")}
            </div>
          </td>

          <td>
            <div class="price">
              ₹${Number(
                product.price || 0
              ).toLocaleString("en-IN")}
            </div>
          </td>

          <td>
            ${escapeHtml(sizes)}
          </td>

          <td>

            <div class="actions">

              <button
                class="action-btn"
                onclick="editProduct('${product.id}')"
              >
                Edit
              </button>

              <button
                class="action-btn delete-btn"
                onclick="deleteProduct('${product.id}')"
              >
                Delete
              </button>

            </div>

          </td>
        `;


      productsTable.appendChild(row);

    });

  }


  updateStats();

}


/* ==========================================
   STATS
========================================== */

function updateStats(){

  totalProducts.textContent =
    products.length;


  const categories =
    new Set(
      products
        .map(function(product){
          return product.category;
        })
        .filter(Boolean)
    );


  totalCategories.textContent =
    categories.size;

}


/* ==========================================
   SEARCH
========================================== */

searchInput.addEventListener(
  "input",
  function(){

    const query =
      searchInput.value
        .trim()
        .toLowerCase();


    const filtered =
      products.filter(function(product){

        return (
          String(product.name || "")
            .toLowerCase()
            .includes(query)
          ||
          String(product.category || "")
            .toLowerCase()
            .includes(query)
        );

      });


    renderProducts(filtered);

  }
);


/* ==========================================
   OPEN ADD PRODUCT
========================================== */

addProductButton.addEventListener(
  "click",
  function(){

    editingProductId = null;

    selectedSizes = [];

    currentImageUrl = null;

    productForm.reset();

    document.getElementById("productId").value = "";

    modalTitle.textContent =
      "Add Product";

    imageStatus.textContent =
      "Choose an image from your phone.";

    updateSizeButtons();

    productModal.style.display =
      "flex";

  }
);


/* ==========================================
   EDIT PRODUCT
========================================== */

window.editProduct =
  function(productId){

    const product =
      products.find(function(item){
        return item.id === productId;
      });


    if(!product){
      return;
    }


    editingProductId =
      product.id;


    document.getElementById("productId").value =
      product.id;


    document.getElementById("productName").value =
      product.name || "";


    document.getElementById("productPrice").value =
      product.price || "";


    document.getElementById("productCategory").value =
      product.category || "";


    document.getElementById("productDescription").value =
      product.description || "";


    currentImageUrl =
      product.image_url || null;


    document.getElementById("productImage").value =
      "";


    imageStatus.textContent =
      currentImageUrl
        ? "Current image is saved. Choose a new image to replace it."
        : "Choose an image from your phone.";


    selectedSizes =
      Array.isArray(product.sizes)
        ? [...product.sizes]
        : [];


    updateSizeButtons();


    modalTitle.textContent =
      "Edit Product";


    productModal.style.display =
      "flex";

  };


/* ==========================================
   DELETE PRODUCT
========================================== */

window.deleteProduct =
  async function(productId){

    const product =
      products.find(function(item){
        return item.id === productId;
      });


    if(!product){
      return;
    }


    const confirmed =
      confirm(
        `Delete "${product.name}"?`
      );


    if(!confirmed){
      return;
    }


    const {
      error
    } = await supabaseClient
      .from("products")
      .delete()
      .eq("id", productId)
      .eq("store_id", STORE_ID);


    if(error){

      console.error(error);

      alert(
        "Could not delete the product."
      );

      return;

    }


    await loadProducts();

  };


/* ==========================================
   SIZE BUTTONS
========================================== */

document
  .querySelectorAll(".size-option")
  .forEach(function(button){

    button.addEventListener(
      "click",
      function(){

        const size =
          button.dataset.size;


        if(selectedSizes.includes(size)){

          selectedSizes =
            selectedSizes.filter(
              function(item){
                return item !== size;
              }
            );

        }else{

          selectedSizes.push(size);

        }


        updateSizeButtons();

      }
    );

  });


function updateSizeButtons(){

  document
    .querySelectorAll(".size-option")
    .forEach(function(button){

      const size =
        button.dataset.size;


      button.classList.toggle(
        "selected",
        selectedSizes.includes(size)
      );

    });

}


/* ==========================================
   IMAGE FILE SELECTION
========================================== */

document
  .getElementById("productImage")
  .addEventListener(
    "change",
    function(){

      const file =
        this.files[0];


      if(!file){

        imageStatus.textContent =
          currentImageUrl
            ? "Current image is saved. Choose a new image to replace it."
            : "Choose an image from your phone.";

        return;

      }


      if(!file.type.startsWith("image/")){

        alert(
          "Please choose an image file."
        );

        this.value = "";

        return;

      }


      const maxSize =
        10 * 1024 * 1024;


      if(file.size > maxSize){

        alert(
          "Image must be smaller than 10MB."
        );

        this.value = "";

        return;

      }


      imageStatus.textContent =
        `Selected: ${file.name}`;

    }
  );
/* ==========================================
   SAVE PRODUCT
========================================== */

productForm.addEventListener(
  "submit",
  async function(event){

    event.preventDefault();


    const saveButton =
      productForm.querySelector(
        'button[type="submit"]'
      );


    const name =
      document
        .getElementById("productName")
        .value
        .trim();


    const price =
      document
        .getElementById("productPrice")
        .value
        .trim();


    const category =
      document
        .getElementById("productCategory")
        .value
        .trim();


    const description =
      document
        .getElementById("productDescription")
        .value
        .trim();


    const imageFile =
      document
        .getElementById("productImage")
        .files[0];


    if(!name){

      alert(
        "Please enter a product name."
      );

      return;

    }


    if(
      !price ||
      isNaN(Number(price))
    ){

      alert(
        "Please enter a valid price."
      );

      return;

    }


    try{

      saveButton.disabled = true;

      saveButton.textContent =
        "Saving...";


      let imageUrl =
        currentImageUrl || null;


      /* ======================================
         UPLOAD NEW IMAGE
      ====================================== */

      if(imageFile){

        imageStatus.textContent =
          "Uploading image...";


        const extension =
          imageFile.name
            .split(".")
            .pop()
            .toLowerCase();


        const filePath =
          `${STORE_ID}/${crypto.randomUUID()}.${extension}`;


        const uploadResult =
          await supabaseClient
            .storage
            .from("product-images")
            .upload(
              filePath,
              imageFile,
              {
                cacheControl: "3600",
                upsert: false,
                contentType:
                  imageFile.type
              }
            );


        if(uploadResult.error){

          throw uploadResult.error;

        }


        const publicResult =
          supabaseClient
            .storage
            .from("product-images")
            .getPublicUrl(
              filePath
            );


        imageUrl =
          publicResult.data.publicUrl;


        imageStatus.textContent =
          "Image uploaded successfully.";

      }


      /* ======================================
         PRODUCT DATA
      ====================================== */

      const productData = {

        store_id:
          STORE_ID,

        name:
          name,

        price:
          Number(price),

        category:
          category || null,

        description:
          description || null,

        image_url:
          imageUrl,

        sizes:
          selectedSizes

      };


      /* ======================================
         UPDATE EXISTING PRODUCT
      ====================================== */

      if(editingProductId){

        const result =
          await supabaseClient
            .from("products")
            .update(
              productData
            )
            .eq(
              "id",
              editingProductId
            )
            .eq(
              "store_id",
              STORE_ID
            );


        if(result.error){

          throw result.error;

        }


        alert(
          "Product updated successfully."
        );

      }


      /* ======================================
         ADD NEW PRODUCT
      ====================================== */

      else{

        const result =
          await supabaseClient
            .from("products")
            .insert(
              productData
            );


        if(result.error){

          throw result.error;

        }


        alert(
          "Product added successfully."
        );

      }


      closeModal();

      await loadProducts();

    }

    catch(error){

      console.error(
        "Product save error:",
        error
      );


      alert(
        error.message ||
        "Something went wrong while saving the product."
      );

    }

    finally{

      saveButton.disabled = false;

      saveButton.textContent =
        editingProductId
          ? "Update Product"
          : "Add Product";

    }

  }
);


/* ==========================================
   CLOSE MODAL
========================================== */

function closeModal(){

  productModal.style.display =
    "none";


  productForm.reset();


  editingProductId =
    null;


  selectedSizes =
    [];


  currentImageUrl =
    null;


  imageStatus.textContent =
    "Choose an image from your phone.";


  updateSizeButtons();

}


/* ==========================================
   CLOSE MODAL BUTTON
========================================== */

closeModalButton.addEventListener(
  "click",
  function(){

    closeModal();

  }
);


/* ==========================================
   CLOSE MODAL WHEN CLICKING OUTSIDE
========================================== */

productModal.addEventListener(
  "click",
  function(event){

    if(
      event.target ===
      productModal
    ){

      closeModal();

    }

  }
);


/* ==========================================
   ESC KEY
========================================== */

document.addEventListener(
  "keydown",
  function(event){

    if(
      event.key === "Escape" &&
      productModal.style.display !== "none"
    ){

      closeModal();

    }

  }
);


/* ==========================================
   HTML ESCAPE
========================================== */

function escapeHtml(value){

  if(value === null ||
     value === undefined){

    return "";

  }


  return String(value)
    .replace(
      /&/g,
      "&amp;"
    )
    .replace(
      /</g,
      "&lt;"
    )
    .replace(
      />/g,
      "&gt;"
    )
    .replace(
      /"/g,
      "&quot;"
    )
    .replace(
      /'/g,
      "&#039;"
    );

}


/* ==========================================
   START APP
========================================== */

checkSession();

</script>
